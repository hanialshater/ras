name: late-interaction-baselines
on:
  pull_request:
  push:
    branches: [codex/colbert-muvera-baselines]
jobs:
  correctness:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src:.
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas scikit-learn PyYAML pytest faiss-cpu threadpoolctl
      - run: python -m pytest -q tests/test_late_interaction.py tests/test_retrieval_comparison.py tests/test_binary.py tests/test_semantic_sidecar.py tests/test_accounting.py tests/test_review_regressions.py tests/test_smoke.py
      - run: python -m experiments.late_interaction_baselines --synthetic --output-dir /tmp/late-hnsw --queries 4 --k 10 --candidates 20 1000 --repetitions 2 --partition-bits 2 --fde-dim 128 --backend hnsw
      - run: python -m experiments.retrieval_comparison --synthetic --output-dir /tmp/retrieval-v2 --queries 4 --k 5 --pool-size 50 --candidates 10 1000 --repetitions 2 --partition-bits 2 --fde-dim 32 --backend hnsw
      - name: Check full-budget HNSW parity and notebook syntax
        run: |
          python - <<'PY'
          import ast, json
          from pathlib import Path
          rows = json.loads(Path('/tmp/late-hnsw/rankings.json').read_text())
          for qid in {r['query_id'] for r in rows}:
              subset = [r for r in rows if r['query_id'] == qid and r['scope'] == 'full_corpus']
              exact = next(r['selected_rows'] for r in subset if r['method'] == 'colbert_exact')
              for row in subset:
                  if row['method'].startswith('muvera') and row['candidate_budget'] == 1000:
                      assert row['selected_rows'] == exact
          nb = json.loads(Path('notebooks/ras_late_interaction_colab.ipynb').read_text())
          for cell in nb['cells']:
              if cell['cell_type'] == 'code':
                  ast.parse(''.join(cell['source']))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-late-interaction
          path: /tmp/late-hnsw
