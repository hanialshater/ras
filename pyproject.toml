[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "random-semantic-algebra"
version = "0.1.0"
description = "Research code for Random Semantic Algebra"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pandas",
  "scikit-learn",
  "datasets",
  "sentence-transformers",
  "transformers",
  "torch",
  "Pillow",
  "matplotlib",
  "PyYAML",
]

[project.optional-dependencies]
dev = ["pytest"]
benchmark = ["faiss-cpu"]
late-interaction = ["colbert-ai==0.2.22", "transformers>=4.36,<4.50", "threadpoolctl"]
modern-retrieval = ["pylate==1.6.0", "sentence-transformers==5.3.0", "transformers==4.49.0", "threadpoolctl"]
upstream-retrieval = ["pylate==1.6.0", "sentence-transformers==5.3.0", "transformers==4.49.0", "rank-bm25==0.2.2"]
demo = ["gradio>=5"]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["rsa_v2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
