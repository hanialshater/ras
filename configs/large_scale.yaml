experiment_name: rsa_large_scale_independent_teacher

data:
  dataset: ashraq/fashion-product-images-small
  n_products: null
  data_seed: 7

retrieval:
  model: sentence-transformers/all-MiniLM-L6-v2
  batch_size: 256

teacher:
  model: openai/clip-vit-base-patch32
  batch_size: 128
  positive_prevalence: 0.40

rsa:
  bits: 4
  quantizer: quantile
  k_coords: 24
  pair_luts: 2
  candidate_pool: 96

benchmark:
  seeds: [7, 17, 27]
  ann_pool: 2000
  n_queries: 200
  min_fit_truth: 100
  max_positive_latents: 3
  allow_negative: true
  retention: [1.0, 0.5, 0.4, 0.3, 0.2, 0.1, 0.05]
  bootstrap_samples: 2000

cache_dir: .cache/ras
results_dir: results
