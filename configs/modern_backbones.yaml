experiment_name: retrieval_modernbert_base

data:
  dataset: ashraq/fashion-product-images-small
  n_products: null
  data_seed: 7

retrieval:
  model: Alibaba-NLP/gte-modernbert-base
  batch_size: 32

teacher:
  model: openai/clip-vit-base-patch32
  batch_size: 128
  positive_prevalence: 0.40

rsa:
  k_coords: 24
  pair_luts: 2
  candidate_pool: 96
  quantizer: quantile

pq:
  m: 64
  nbits: 8

benchmark:
  seeds: [7, 17, 27]
  ann_pool: 5000
  n_queries: 200
  min_fit_truth: 100
  max_positive_latents: 3
  allow_negative: true
  retention: [1.0, 0.5, 0.4, 0.3, 0.2, 0.1, 0.05]
  bootstrap_samples: 2000

cache_dir: .cache/ras
results_dir: results

